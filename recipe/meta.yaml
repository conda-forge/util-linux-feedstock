{% set version = "2.42.2" %}
{% set major_minor = '.'.join(version.split('.')[:2]) %}

package:
  name: util-linux
  version: {{ version }}

source:
  url: https://mirrors.edge.kernel.org/pub/linux/utils/util-linux/v{{ major_minor }}/util-linux-{{ version }}.tar.xz
  sha256: 03a05d3adf9602ef128f2da05b84b3205ce60c351e5737c0370f74000679ce8a
  patches:
    # https://github.com/util-linux/util-linux/pull/4554
    - 4554-kill-decode-strip-RT0.patch

build:
  number: 2
  skip: true  # [not unix]
  run_exports:
    - {{ pin_subpackage('util-linux', max_pin='x.x') }}

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - gnuconfig  # [unix]
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - make
    - libtool
    - autoconf
    - automake
    - gettext-tools
    - pkg-config
  host:
    - python
    - zlib
    - ncurses
    - readline
    - libuuid {{ version }}
    - libxcrypt  # [linux]
  run:
    - python
    - libuuid {{ version }}

test:
  commands:
    - test -f "${PREFIX}/lib/libmount.so"  # [linux]
    - test -f "${PREFIX}/bin/hexdump"
    - wipefs --version
    - blkid --version

about:
  home: https://en.wikipedia.org/wiki/Util-linux
  license: LGPL-2.0-or-later
  license_family: GPL
  license_file: COPYING
  summary: A random collection of Linux utilities
  dev_url: https://github.com/util-linux/util-linux

extra:
  recipe-maintainers:
    - jaimergp
    - scopatz
    - hmaarrfk
